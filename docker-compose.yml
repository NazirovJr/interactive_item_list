version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: item-list-server
    container_name: item-list-server
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001/api/items?page=0&limit=1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: item-list-client
    container_name: item-list-client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped 